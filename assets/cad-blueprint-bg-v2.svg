<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrowStart" viewBox="0 0 10 6" refX="9" refY="3"
            markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,1 L9,3 L0,5 Z" fill="#17171766"/>
    </marker>
    <marker id="arrowEnd" viewBox="0 0 10 6" refX="9" refY="3"
            markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,1 L9,3 L0,5 Z" fill="#17171766"/>
    </marker>
    <marker id="cutArrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#171717"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#17171760" stroke-width="1"/>
    </pattern>
    <marker id="leaderArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- sheet border -->
  <rect x="14" y="14" width="1172" height="672" fill="none" stroke="#17171740" stroke-width="1"/>

  <!-- ============ FRONT VIEW ============ -->
  <g fill="none" stroke="#171717aa" stroke-width="1.6">
    <path d="M150,130 L600,130 L600,390 L570,420 L150,420 Z"/>
    <circle cx="260" cy="260" r="20"/>
    <circle cx="490" cy="260" r="20"/>
  </g>

  <!-- centerlines -->
  <g stroke="#17171755" stroke-width="0.9" stroke-dasharray="20,5,3,5">
    <line x1="260" y1="185" x2="260" y2="335"/>
    <line x1="490" y1="185" x2="490" y2="335"/>
    <line x1="195" y1="260" x2="555" y2="260"/>
  </g>

  <!-- cutting plane A-A (vertical, through left hole) -->
  <g stroke="#171717" stroke-width="1.3" stroke-dasharray="26,4,4,4">
    <line x1="260" y1="88" x2="260" y2="462"/>
  </g>
  <g stroke="#171717" stroke-width="1.3">
    <line x1="260" y1="96" x2="282" y2="96" marker-end="url(#cutArrow)"/>
    <line x1="260" y1="454" x2="282" y2="454" marker-end="url(#cutArrow)"/>
  </g>
  <text x="252" y="82" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#171717">A</text>
  <text x="252" y="475" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#171717">A</text>

  <!-- overall width dimension -->
  <g stroke="#17171755" stroke-width="1">
    <line x1="150" y1="420" x2="150" y2="480"/>
    <line x1="600" y1="390" x2="600" y2="480"/>
    <line x1="150" y1="466" x2="350" y2="466" marker-start="url(#arrowStart)"/>
    <line x1="405" y1="466" x2="600" y2="466" marker-end="url(#arrowEnd)"/>
  </g>
  <text x="378" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#6B6862">450</text>

  <!-- overall height dimension -->
  <g stroke="#17171755" stroke-width="1">
    <line x1="150" y1="130" x2="105" y2="130"/>
    <line x1="150" y1="420" x2="105" y2="420"/>
    <line x1="120" y1="130" x2="120" y2="255" marker-start="url(#arrowStart)"/>
    <line x1="120" y1="310" x2="120" y2="420" marker-end="url(#arrowEnd)"/>
  </g>
  <text x="120" y="285" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#6B6862" transform="rotate(-90 120 280)">290</text>

  <!-- hole spacing dimension -->
  <g stroke="#17171755" stroke-width="1">
    <line x1="260" y1="185" x2="260" y2="105"/>
    <line x1="490" y1="185" x2="490" y2="105"/>
    <line x1="260" y1="118" x2="345" y2="118" marker-start="url(#arrowStart)"/>
    <line x1="405" y1="118" x2="490" y2="118" marker-end="url(#arrowEnd)"/>
  </g>
  <text x="375" y="114" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6B6862">230</text>

  <!-- GD&T feature control frame + leader -->
  <path d="M 505,247 L 555,205 L 585,205" fill="none" stroke="#F59E0B" stroke-width="1.3" marker-start="url(#leaderArrow)"/>
  <g transform="translate(585,190)">
    <rect x="0" y="0" width="30" height="26" fill="none" stroke="#171717" stroke-width="1.2"/>
    <rect x="30" y="0" width="58" height="26" fill="none" stroke="#171717" stroke-width="1.2"/>
    <rect x="88" y="0" width="26" height="26" fill="none" stroke="#171717" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="7.5" fill="none" stroke="#171717" stroke-width="1.1"/>
    <line x1="15" y1="4" x2="15" y2="22" stroke="#171717" stroke-width="1"/>
    <line x1="6" y1="13" x2="24" y2="13" stroke="#171717" stroke-width="1"/>
    <text x="59" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#171717">&#8960;0.10 M</text>
    <text x="101" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#171717">A</text>
  </g>
  <!-- datum feature A -->
  <path d="M600,340 L618,332 L618,348 Z" fill="#171717"/>
  <line x1="618" y1="340" x2="645" y2="340" stroke="#171717" stroke-width="1.2"/>
  <rect x="645" y="326" width="28" height="28" fill="none" stroke="#171717" stroke-width="1.3"/>
  <text x="659" y="345" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="600" fill="#171717">A</text>

  <!-- surface finish symbol -->
  <path d="M405,130 L397,150 L389,130 M397,150 L410,105" fill="none" stroke="#171717" stroke-width="1.2"/>
  <text x="413" y="108" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B6862">3.2</text>

  <!-- chamfer note -->
  <path d="M570,420 L620,450 L650,450" fill="none" stroke="#17171755" stroke-width="1" marker-start="url(#arrowStart)"/>
  <text x="656" y="454" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#6B6862">1.5 X 45&#176;</text>


  <!-- ============ SECTION A-A ============ -->
  <g>
    <path d="M800,220 L890,220 L890,245 L905,245 L905,300 L800,300 Z"
          fill="url(#hatch)" stroke="#171717aa" stroke-width="1.4"/>
    <path d="M1050,220 L960,220 L960,245 L945,245 L945,300 L1050,300 Z"
          fill="url(#hatch)" stroke="#171717aa" stroke-width="1.4"/>
  </g>

  <!-- thickness dimension -->
  <g stroke="#17171755" stroke-width="1">
    <line x1="1050" y1="220" x2="1090" y2="220"/>
    <line x1="1050" y1="300" x2="1090" y2="300"/>
    <line x1="1078" y1="220" x2="1078" y2="300" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <text x="1078" y="264" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6B6862" transform="rotate(-90 1078 264)">12</text>

  <text x="925" y="335" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#171717">SECTION A-A</text>
  <text x="925" y="354" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6B6862" letter-spacing="0.5">SCALE 1:1</text>


  <!-- ============ TITLE BLOCK ============ -->
  <g stroke="#17171755" stroke-width="1" fill="none">
    <rect x="800" y="560" width="360" height="90"/>
    <line x1="800" y1="590" x2="1160" y2="590"/>
    <line x1="800" y1="620" x2="1160" y2="620"/>
    <line x1="960" y1="590" x2="960" y2="650"/>
    <line x1="1060" y1="590" x2="1060" y2="650"/>
  </g>
  <text x="812" y="580" font-family="'JetBrains Mono', monospace" font-size="13" fill="#171717" letter-spacing="0.5">BRACKET, MOUNTING</text>
  <text x="812" y="608" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">MATL: 6061-T6 AL</text>
  <text x="812" y="638" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">DWG NO. ME-0142</text>
  <text x="972" y="608" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">SCALE 1:2</text>
  <text x="972" y="638" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">SHEET 1/1</text>
  <text x="1072" y="608" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">TOL &#177;0.05</text>
  <text x="1072" y="638" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6862">UNITS: MM</text>

</svg>
